spring.application.name=group-savings-webapp

# Server Configuration
server.port=8080
server.servlet.context-path=/groupsavings

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/group_savings_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=nullvoid
spring.datasource.password=P4ssW0rd@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# For pretty JSON
spring.jackson.serialization.indent-output=true

# For date formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Manila

# Log level ng iyong app
logging.level.com.groupsavings=DEBUG

# Log level ng Spring
logging.level.org.springframework=WARN

# Log level ng Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Log level ng database transactions
logging.level.org.springframework.transaction=DEBUG
