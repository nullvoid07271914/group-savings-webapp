                    <h4 class="card-title">Registration Form</h4>
                    <p class="card-description">Registration for new member(s) or borrower(s)</p>
                    <form class="member_registration_form" novalidate>
                      <div class="form-group">
                        <label for="inputForFirstname">Firstname</label>
                        <input type="text" class="form-control" id="firstname" name="firstname">
                      </div>
                      <div class="form-group">

                      <div class="form-group">

                      <div class="form-group">

                      </div>
                      <div class="form-group">
                        <label for="inputForProvince">Province</label>

                      </div>
                      <div class="form-group">
                        <label for="inputForZipcode">Zipcode</label>
                        <input type="text" class="form-control" id="zipcode" name="zipcode">
                      </div>
                      <button type="submit" class="btn btn-gradient-primary me-2">Submit</button>
                      <button class="btn btn-light">Cancel</button>
                    </form>
                  </div>
                </div>

    <script type="text/javascript">
	$(document).ready(function() {
		
		// Enhanced button with spinner
		function setLoading(button, isLoading) {
		    if (isLoading) {
		        button.prop('disabled', true).html(`
		            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
		            Submitting...
		        `);
		    } else {
		        button.prop('disabled', false).text('Submit');
		    }
		}
		
	    const MemberForm = {
	        init: function() {
	            this.form = $('.member_registration_form');
	            this.submitBtn = this.form.find('button[type="submit"]');
	            this.bindEvents();
	        },
	        
	        bindEvents: function() {
	            this.form.on('submit', $.proxy(this.handleSubmit, this));
	            
	            // Real-time validation (optional)
	            this.form.find('input, select').on('blur', $.proxy(this.validateField, this));
	        },
	        
	        handleSubmit: function(e) {
	            e.preventDefault();
	            
	            if (!this.validateForm()) {
	                return;
	            }
	            
	            this.setLoading(true);
	            
	            const data = this.getFormData();
	            
	            $.ajax({
	                url: 'http://localhost:8080/groupsavings/api/v1/member/register',
	                type: 'POST',
	                contentType: 'application/json',
	                data: JSON.stringify(data),
	                dataType: 'json',
	                success: $.proxy(this.handleSuccess, this),
	                error: $.proxy(this.handleError, this),
	                complete: $.proxy(function() {
	                    this.setLoading(false);
	                }, this)
	            });
	        },
	        
	        getFormData: function() {
	            const formArray = this.form.serializeArray();
	            const data = {};
	            
	            $.each(formArray, function(_, field) {
	                data[field.name] = field.value.trim();
	            });
	            
	            return data;
	        },
	        
	        validateForm: function() {
	            let isValid = true;
	            this.form.find('[name]').each(function() {
	                if (!$(this).val().trim()) {
	                    $(this).addClass('is-invalid');
	                    isValid = false;
	                } else {
	                    $(this).removeClass('is-invalid');
	                }
	            });
	            
	            if (!isValid) {
	                this.showAlert('warning', 'Please fill in all required fields.');
	            }
	            
	            return isValid;
	        },
	        
	        validateField: function(e) {
	            const $field = $(e.target);
	            if ($field.val().trim()) {
	                $field.removeClass('is-invalid');
	            }
	        },
	        
	        setLoading: function(isLoading) {
	            if (isLoading) {
	                this.submitBtn.prop('disabled', true).html(`
	                    <span class="spinner-border spinner-border-sm" role="status"></span>
	                    Submitting...
	                `);
	            } else {
	                this.submitBtn.prop('disabled', false).text('Submit');
	            }
	        },
	        
	        handleSuccess: function(response) {
	            console.log('Member created:', response);
	            
	            this.showAlert('success', 'Member registered successfully!');
	            this.form[0].reset();
	            
	            // Optional: Redirect to member list
	            // setTimeout(() => {
	            //     window.location.href = '/groupsavings/members';
	            // }, 2000);
	        },
	        
	        handleError: function(xhr) {
	            if (xhr.status === 400 && xhr.responseJSON) {
	                // Display validation errors from backend
	                this.displayFieldErrors(xhr.responseJSON);
	                this.showAlert('danger', 'Please fix the errors below.');
	            } else if (xhr.status === 409) {
	                this.showAlert('warning', xhr.responseJSON.message || 'Duplicate entry found.');
	            } else {
	                this.showAlert('danger', 'An error occurred. Please try again.');
	            }
	        },
	        
	        displayFieldErrors: function(errors) {
	            // Clear previous errors
	            this.form.find('.is-invalid').removeClass('is-invalid');
	            this.form.find('.invalid-feedback').remove();
	            
	            // Display new errors
	            $.each(errors, function(field, messages) {
	                const $input = $('#' + field);
	                const message = Array.isArray(messages) ? messages[0] : messages;
	                
	                $input.addClass('is-invalid');
	                $input.after(`<div class="invalid-feedback">${message}</div>`);
	            });
	        },
	        
	        showAlert: function(type, message) {
	            // Remove existing alerts
	            $('.alert-dynamic').remove();
	            
	            const alertHtml = `
	                <div class="alert alert-${type} alert-dynamic alert-dismissible fade show" style="margin-top: 12px;" role="alert">
	                    <i class="fa fa-${this.getAlertIcon(type)} me-2"></i>
	                    ${message}
	                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	                </div>
	            `;
	            
	            this.form.before(alertHtml);
	            this.form.after(alertHtml);
	            
	            // Auto dismiss
	            setTimeout(() => $('.alert-dynamic').fadeOut('slow', function() {
	                $(this).remove();
	            }), 5000);
	        },
	        
	        getAlertIcon: function(type) {
	            const icons = {
	                'success': 'check-circle',
	                'danger': 'exclamation-circle',
	                'warning': 'exclamation-triangle',
	                'info': 'info-circle'
	            };
	            return icons[type] || 'info-circle';
	        }
	    };
	    
	    // Initialize
	    MemberForm.init();
	});
    </script>
  </body>
