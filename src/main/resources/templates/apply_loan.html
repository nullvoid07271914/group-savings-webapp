    <script type="text/javascript">
	    $(document).ready(function() {
	        
	    	function getMemberCodeFromUrl() {
	            const path = window.location.pathname;
	            const parts = path.split('/');
	            return parts[parts.length - 1];
	        }
	    	
	    	function isValidMemberCode(code) {
	    	    const pattern = /^\d{4}[A-Z0-9]{8}$/;
	    	    return pattern.test(code);
	    	}
	        
	        const memberCode = getMemberCodeFromUrl();
	        
	        if (!isValidMemberCode(memberCode)) {
	            showAlert('danger', 'Invalid member code');
	            return;
	        }
	        
	        const MemberInfo = {
	            init: function() {
	                this.memberCode = memberCode;
	                this.loadMemberInfo();
	            },
	            
	            loadMemberInfo: function() {
	                $.ajax({
	                    url: 'http://localhost:8080/groupsavings/api/v1/member/info/' + this.memberCode,
	                    type: 'GET',
	                    contentType: 'application/json',
	                    dataType: 'json',
	                    success: $.proxy(this.handleSuccess, this),
	                    error: $.proxy(this.handleError, this)
	                });
	            },
	            
	            handleSuccess: function(response) {
	                console.log('Member loaded:', response);
	                
	                // Populate form fields
	                this.populateForm(response);
	                
	                // Show success message (optional)
	                this.showAlert('success', 'Member information loaded!');
	            },
	            
	            handleError: function(xhr) {
	                console.error('Error:', xhr.responseText);
	                
	                if (xhr.status === 404) {
	                    this.showAlert('warning', 'Member not found.');
	                } else {
	                    this.showAlert('danger', 'Failed to load member information.');
	                }
	            },
	            
	            populateForm: function(data) {
	                // Map response to form fields
	                const fieldMappings = {
	                    'fullname': data.firstname + " " + data.lastname,
	                    'interest': data.interest,
	                    'loanCode': data.loanCode
	                };
	                
	                // Loop through mappings and set values
	                $.each(fieldMappings, function(fieldId, value) {
	                	if (fieldId === 'loanCode') {
	                		$('#' + fieldId).text('Loan Code# ' + value);
	                	} else {
	                        $('#' + fieldId).val(value);
	                    }
	                });
	            },
	            
	            showAlert: function(type, message) {
	                // Remove existing alerts
	                $('.alert-dynamic').remove();
	                
	                const icons = {
	                    'success': 'check-circle',
	                    'danger': 'exclamation-circle',
	                    'warning': 'exclamation-triangle',
	                    'info': 'info-circle'
	                };
	                
	                const alertHtml = `
	                    <div class="alert alert-${type} alert-dynamic alert-dismissible fade show" style="margin-top: 12px;" role="alert">
	                        <i class="fa fa-${icons[type]} me-2"></i>
	                        ${message}
	                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	                    </div>
	                `;
	                
	                $('.forms-sample').before(alertHtml);
	                
	                setTimeout(() => $('.alert-dynamic').fadeOut('slow', function() {
	                    $(this).remove();
	                }), 5000);
	            },
	            
	            // New method to submit loan form
	            submitLoan: function(event) {
	                event.preventDefault();
	                $("button[type='submit']").prop("disabled", true);
	                
	                // Get form values
	                const loanData = {
	                    memberCode: this.memberCode,
	                    loanCode: $('#loanCode').text().replace('Loan Code# ', ''),
	                    loanAmount: $('#loanAmount').val(),
	                    terms: $('#loanTerms').val()
	                };
	                
	                // Validate
	                if (!loanData.loanAmount || !loanData.terms) {
	                    this.showAlert('warning', 'Please fill in all required fields');
	                    return;
	                }
	                
	                // Submit to API
	                $.ajax({
	                    url: 'http://localhost:8080/groupsavings/api/v1/loan/apply',
	                    type: 'POST',
	                    contentType: 'application/json',
	                    dataType: 'json',
	                    data: JSON.stringify(loanData),
	                    success: $.proxy(this.handleLoanSuccess, this),
	                    error: $.proxy(this.handleLoanError, this)
	                });
	            },
	            
	            handleLoanSuccess: function(response) {
	            	$("button[type='submit']").text("STATUS - PENDING");
	                
	                // Populate the hidden fields
	                $('#loanCode').text('Loan Code# ' + response.loanCode);
	                $('#dueDate').val(response.dueDate);
	                $('#totalAmount').val(response.totalAmount);
	                $('#amortization').val(response.amortization);
	                $('#dateApplied').val(response.dateApplied);
	                
	                // Load contributors to table
	                this.loadContributors(response.loanContributors);
	                
	                this.showAlert('success', 'Loan created successfully!');
	            },
	            
	            handleLoanError: function(xhr) {
	            	var response = JSON.parse(xhr.responseText);
	                var message = response.message
	                this.showAlert('danger', 'Failed to create loan. ' + message);
	            },
	            
	            // New method to load contributors to table
	            loadContributors: function(contributors) {
	                const tbody = $('.table tbody');
	                tbody.empty(); // Clear existing rows
	                
	                if (!contributors || contributors.length === 0) {
	                    tbody.append(`
	                        <tr>
	                            <td colspan="3" class="text-center">No contributors found</td>
	                        </tr>
	                    `);
	                    return;
	                }
	                
	                // Loop through contributors and create table rows
	                $.each(contributors, function(index, contributor) {
	                    const percentage = contributor.percentage * 100;
	                    const row = `
	                        <tr>
	                            <td>${contributor.fullname}</td>
	                            <td>
	                                <div class="progress">
	                                    <div class="progress-bar bg-info" role="progressbar" 
	                                         style="width: ${percentage}%" 
	                                         aria-valuenow="${percentage}" 
	                                         aria-valuemin="0" 
	                                         aria-valuemax="100">
	                                        ${percentage.toFixed(2)}%
	                                    </div>
	                                </div>
	                            </td>
	                            <td>Php ${contributor.amount}</td>
	                        </tr>
	                    `;
	                    tbody.append(row);
	                });
	            }
	        };
	        
	        // Initialize
	        MemberInfo.init();
	        
	        // Bind form submit event
	        $('form.forms-sample').on('submit', function(event) {
	            MemberInfo.submitLoan(event);
	        });
	    });
	</script>
