    <script type="text/javascript">
	    $(document).ready(function() {
	        const MemberInfo = {
	            init: function() {
	                this.loadLoansInfo();
	            },
	            
	            loadLoansInfo: function() {
	                $.ajax({
	                    url: 'http://localhost:8080/groupsavings/api/v1/loan/manage',
	                    type: 'GET',
	                    contentType: 'application/json',
	                    dataType: 'json',
	                    success: $.proxy(this.handleSuccess, this),
	                    error: $.proxy(this.handleError, this)
	                });
	            },
	            
	            handleSuccess: function(response) {
	                console.log('Member loaded:', response);
	                
	                this.loadLoans(response);
	                
	                this.showAlert('success', 'Member information loaded!');
	            },
	            
	            handleError: function(xhr) {
	                console.error('Error:', xhr.responseText);
	                
	                if (xhr.status === 404) {
	                    this.showAlert('warning', 'Member not found.');
	                } else {
	                    this.showAlert('danger', 'Failed to load member information.');
	                }
	            },
	            
	            loadLoans: function(loans) {
	                const tbody = $('.table tbody');
	                tbody.empty();
	                
	                if (!loans || loans.length === 0) {
	                    tbody.append(`
	                        <tr>
	                            <td colspan="3" class="text-center">No contributors found</td>
	                        </tr>
	                    `);
	                    return;
	                }
	                
	                $.each(loans, function(index, loan) {
	                    const row = `
	                        <tr>
	                            <td>${loan.member.firstname + ' ' + loan.member.lastname}</td>
	                            <td>Php ${loan.loanAmount}</td>
	                            <td>${loan.terms}</td>
	                            <td>Php ${loan.amortization}</td>
	                            <td>${loan.dateApplied}</td>
	                            <td>${loan.loanStatus}</td>
	                            <td>
	                            	<button type="button" class="btn btn-gradient-info btn-rounded btn-fw">Approve</button>
	                            	<button type="button" class="btn btn-gradient-danger btn-rounded btn-fw">Reject</button>
	                            </td>
	                        </tr>
	                    `;
	                    tbody.append(row);
	                });
	            },
	            
	            showAlert: function(type, message) {
	                // Remove existing alerts
	                $('.alert-dynamic').remove();
	                
	                const icons = {
	                    'success': 'check-circle',
	                    'danger': 'exclamation-circle',
	                    'warning': 'exclamation-triangle',
	                    'info': 'info-circle'
	                };
	                
	                const alertHtml = `
	                    <div class="alert alert-${type} alert-dynamic alert-dismissible fade show" style="margin-top: 12px;" role="alert">
	                        <i class="fa fa-${icons[type]} me-2"></i>
	                        ${message}
	                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	                    </div>
	                `;
	                
	                $('.table').before(alertHtml);
	                
	                setTimeout(() => $('.alert-dynamic').fadeOut('slow', function() {
	                    $(this).remove();
	                }), 5000);
	            }
	        };
	        
	        // Initialize
	        MemberInfo.init();
	    });
	</script>
