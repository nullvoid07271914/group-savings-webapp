<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navMenu">
  <div class="nav-item"
       th:classappend="${currentUri.contains('/dashboard')} ? 'active' : ''"
       th:onclick="|location.href='@{/dashboard}'|">
    <div class="nav-item-left"><i class="fas fa-chart-line"></i><span>Dashboard</span></div>
  </div>

  <div>
    <div class="nav-item"
         th:classappend="${currentUri.contains('/member')} ? 'active' : ''"
         onclick="toggleSubmenu(this)">
      <div class="nav-item-left"><i class="fas fa-users"></i><span>Members</span></div>
      <i class="fas fa-chevron-down nav-toggle"
         th:classappend="${currentUri.contains('/member')} ? 'rotated' : ''"></i>
    </div>
    <div class="submenu" th:classappend="${currentUri.contains('/member')} ? 'open' : ''">
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/member/register')} ? 'active' : ''"
           th:onclick="|location.href='@{/member/register}'|"><i class="fas fa-user-plus"></i> Member Registration</div>
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/member/list')} ? 'active' : ''"
           th:onclick="|location.href='@{/member/list}'|"><i class="fas fa-list"></i> All Members</div>
    </div>
  </div>

  <div>
    <div class="nav-item"
         th:classappend="${currentUri.contains('/contribution')} ? 'active' : ''"
         onclick="toggleSubmenu(this)">
      <div class="nav-item-left"><i class="fas fa-coins"></i><span>Contributions</span></div>
      <i class="fas fa-chevron-down nav-toggle"
         th:classappend="${currentUri.contains('/contribution')} ? 'rotated' : ''"></i>
    </div>
    <div class="submenu" th:classappend="${currentUri.contains('/contribution')} ? ' open' : ''">
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/contribution/add-contribute')} ? 'active' : ''"
           th:onclick="|location.href='@{/contribution/add-contribute}'|"><i class="fas fa-plus-circle"></i> Add Contribution</div>
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/contribution/summary')} ? 'active' : ''"
           th:onclick="|location.href='@{/contribution/summary}'|"><i class="fas fa-chart-simple"></i> Member Contributions</div>
    </div>
  </div>

  <div>
    <div class="nav-item"
         th:classappend="${currentUri.contains('/loan')} ? 'active' : ''"
         onclick="toggleSubmenu(this)">
      <div class="nav-item-left"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></div>
      <i class="fas fa-chevron-down nav-toggle"
            th:classappend="${currentUri.contains('/loan')} ? 'rotated' : ''"></i>
    </div>
    <div class="submenu" th:classappend="${currentUri.contains('/loan')} ? ' open' : ''">
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/loan/apply')} ? 'active' : ''"
           th:onclick="|location.href='@{/loan/apply}'|"><i class="fas fa-file-invoice"></i> Apply Loan</div>
      <div class="submenu-item"
           th:classappend="${currentUri.endsWith('/loan/manage')} ? 'active' : ''"
           th:onclick="|location.href='@{/loan/manage}'|"><i class="fas fa-chart-line"></i> Manage Loan</div>
    </div>
  </div>

  <div class="nav-item"
       th:classappend="${currentUri.contains('/profits')} ? 'active' : ''"
       th:onclick="|location.href='@{/profits}'|">
    <div class="nav-item-left"><i class="fas fa-chart-line"></i><span>Profits</span></div>
  </div>

  <div class="nav-divider"></div>
  <div class="nav-item" onclick="location.href='reports.html'">
    <div class="nav-item-left"><i class="fas fa-chart-pie"></i><span>Reports</span></div>
  </div>
  <div class="nav-item" onclick="location.href='settings.html'">
    <div class="nav-item-left"><i class="fas fa-cog"></i><span>Settings</span></div>
  </div>
</nav>

</body>
</html>
