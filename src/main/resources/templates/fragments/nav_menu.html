<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- partial:../../partials/_sidebar.html -->
<nav th:fragment="navMenu" class="sidebar sidebar-offcanvas" id="sidebar">
  <ul class="nav">
    <li class="nav-item nav-profile">
      <a href="#" class="nav-link">
        <div class="nav-profile-image">
          <img th:src="@{/assets/images/faces/face1.jpg}" alt="profile" />
          <span class="login-status online"></span>
          <!--change to offline or busy as needed-->
        </div>
        <div class="nav-profile-text d-flex flex-column">
          <span class="font-weight-bold mb-2">David Grey. H</span>
          <span class="text-secondary text-small">Project Manager</span>
        </div>
        <i class="mdi mdi-bookmark-check text-success nav-profile-badge"></i>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/index.html}">
        <span class="menu-title">Dashboard</span>
        <i class="mdi mdi-home menu-icon"></i>
      </a>
    </li>
    <li class="nav-item" th:classappend="${currentUri.contains('/contribution/')} ? 'active' : ''">
      <a class="nav-link" data-bs-toggle="collapse" href="#contri" aria-expanded="false" aria-controls="icons">
        <span class="menu-title">Contribution</span>
        <i class="mdi mdi-format-list-bulleted menu-icon"></i>
      </a>
      <div class="collapse" id="contri">
        <ul class="nav flex-column sub-menu">
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/contribution/search-member')} ? 'active' : ''"
            	th:href="@{/contribution/search-member}">Contribute</a>
          </li>
        </ul>
      </div>
    </li>
    <li class="nav-item" th:classappend="${currentUri.contains('/member/')} ? 'active' : ''">
      <a class="nav-link" data-bs-toggle="collapse" href="#mem" aria-expanded="false" aria-controls="icons">
        <span class="menu-title">Accounts</span>
        <i class="mdi mdi-format-list-bulleted menu-icon"></i>
      </a>
      <div class="collapse" id="mem">
        <ul class="nav flex-column sub-menu">
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/member/register')} ? 'active' : ''"
            	th:href="@{/member/register}">Member Registration</a>
          </li>
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/member/list')} ? 'active' : ''"
            	th:href="@{/member/list}">View Members</a>
          </li>
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/member/profits')} ? 'active' : ''"
            	th:href="@{/member/profits}">View Members Profits</a>
          </li>
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/member/contributions')} ? 'active' : ''"
            	th:href="@{/member/contributions}">View Member Contributions</a>
          </li>
        </ul>
      </div>
    </li>
    <li class="nav-item" th:classappend="${currentUri.contains('/loan/')} ? 'active' : ''">
      <a class="nav-link" data-bs-toggle="collapse" href="#loan" aria-expanded="false" aria-controls="forms">
        <span class="menu-title">Loans</span>
        <i class="mdi mdi-format-list-bulleted menu-icon"></i>
      </a>
      <div class="collapse" id="loan">
        <ul class="nav flex-column sub-menu">
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/loan/manage')} ? 'active' : ''"
            	th:href="@{/loan/manage}">Manage Loans</a>
          </li>
          <li class="nav-item">
            <a class="nav-link"
            	th:classappend="${currentUri.endsWith('/loan/apply')} ? 'active' : ''"
            	th:href="@{/loan/apply}">Apply Loan</a>
          </li>
        </ul>
      </div>
    </li>
  </ul>
</nav>
</body>
</html>
